name: node-release

# Reusable release for every Node plugin package in the Maestro suite.
# Callers: ddtcorex/<package>/.github/workflows/release.yml (on push tag v*.*.*)
# Does: checkout tag → pnpm install/build → pnpm publish --access public → GitHub Release

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js major version
        type: string
        default: '22'
      pnpm-version:
        description: pnpm major version; empty uses packageManager field
        type: string
        default: '11'
      run-build:
        description: Run `pnpm build` before publish
        type: boolean
        default: true
      sibling-repos:
        description: Lines of "<repo> <ref> [target]" cloned+built under ../ before install (e.g. "dsh-maestro-config-lib master")
        type: string
        default: ''
    secrets:
      npm-token:
        description: NPM_TOKEN for pnpm publish
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: inputs.pnpm-version != ''
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: pnpm/action-setup@v4
        if: inputs.pnpm-version == ''

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Enforce RULES
        run: |
          echo "[enforce-rules] hard gate — blacklist + protection + publish gate"
          if [ -f scripts/enforce-rules.mjs ]; then
            node scripts/enforce-rules.mjs
            node scripts/enforce-rules.mjs --check-protection || echo "[enforce-rules] --check-protection skipped"
            node scripts/enforce-rules.mjs --check-publish || echo "[enforce-rules] --check-publish skipped"
          elif [ -f ../maestro-harness/scripts/enforce-rules.mjs ]; then
            node ../maestro-harness/scripts/enforce-rules.mjs
            node ../maestro-harness/scripts/enforce-rules.mjs --check-protection || true
            node ../maestro-harness/scripts/enforce-rules.mjs --check-publish || true
          else
            echo "[enforce-rules] no local script, running inline leak guard"
            if grep -R --include="*.md" --include="*.ts" --include="*.js" --include="*.json" "dsh-company\|dsh-home" . 2>/dev/null | grep -v ".git" | grep -q .; then
              echo "❌ private hostname leak detected"; exit 1
            fi
          fi

      - name: Enforce RULES — version == tag
        run: |
          v="$(jq -r .version package.json 2>/dev/null || echo "")"
          tag="${GITHUB_REF_NAME#v}"
          if [ -n "$v" ] && [ -n "$tag" ] && [ "$v" != "$tag" ]; then
            echo "❌ package.json version ($v) != tag ($tag)"; exit 1
          fi
          echo "[enforce-rules] version gate OK: $v == $tag (or no tag context)"

      # Cross-package deps use workspace:^ + a ../<pkg> workspace member, which
      # only resolves when the sibling checkout exists beside this one.
      # This mirrors the `sibling-repos` handling in node-plugin.yml for CI.
      - name: Checkout and build sibling repos
        if: inputs.sibling-repos != ''
        env:
          SIBLINGS: ${{ inputs.sibling-repos }}
        run: |
          while read -r repo ref target; do
            [ -z "$repo" ] && continue
            if [ -z "$ref" ] && [ "${repo#*@}" != "$repo" ]; then
              ref="${repo##*@}"; repo="${repo%%@*}"
            fi
            dest="../${target:-$repo}"
            mkdir -p "$(dirname "$dest")"
            git clone --depth 1 --branch "$ref" "https://github.com/ddtcorex/${repo}.git" "$dest"
            (cd "$dest" && corepack enable && pnpm install --frozen-lockfile && pnpm build)
          done <<< "$SIBLINGS"

      - name: Auto-clone config-lib for workspace deps (fallback)
        if: inputs.sibling-repos == ''
        run: |
          if grep -q '"@ddtcorex/dsh-maestro-config-lib": "workspace:' package.json 2>/dev/null; then
            echo "[sibling] workspace dep detected, cloning dsh-maestro-config-lib master"
            dest="../dsh-maestro-config-lib"
            if [ ! -d "$dest" ]; then
              git clone --depth 1 --branch master "https://github.com/ddtcorex/dsh-maestro-config-lib.git" "$dest"
            fi
            (cd "$dest" && corepack enable && pnpm install --frozen-lockfile && pnpm build)
          else
            echo "[sibling] no workspace config-lib dep, skip"
          fi

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ inputs.run-build }}
        run: pnpm build

      - name: Require flat lib/index.js
        run: test -f lib/index.js

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$version" '
              /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md || true
            cat release-notes.md
          else
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
